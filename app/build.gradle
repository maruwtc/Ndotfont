plugins { id 'com.android.application' }

android {
    namespace 'com.chriswong.ndotforce'
    compileSdk 34

    defaultConfig {
        applicationId "com.chriswong.ndotforce"
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    // NdotFontForce-v1.2-debug.apk instead of app-debug.apk
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "NdotFontForce-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly project(':xposed-stubs')
}
